services:
  - type: web
    name: commutebeh-rails
    runtime: ruby
    region: singapore
    plan: starter
    buildCommand: bundle install
    # preDeployCommand is a paid-plan feature — on the free plan Render accepts it in
    # this file but silently never runs it, with no warning anywhere. That is what
    # actually broke production on 2026-08-07: a deploy shipped code querying a table
    # a migration was supposed to create, the migration never ran, and every request
    # to that code path 503'd until the deploy was reverted. Migrating from inside
    # startCommand instead runs on every boot — including the free plan's frequent
    # idle-timeout cold starts, which is wasted work but a harmless no-op once a
    # migration has already applied — and `&&` means Puma never starts, so the app
    # never serves traffic, if the migration fails.
    startCommand: bundle exec rails db:migrate && bundle exec puma -C config/puma.rb
    healthCheckPath: /health
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SKIP_ASSET_COMPILATION
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DEVISE_JWT_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HONO_API_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        value: ap-southeast-1
      - key: SUPABASE_STORAGE_BUCKET
        value: commute-navigator-maps
