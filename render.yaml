services:
  - type: web
    name: commutebeh-rails
    runtime: ruby
    region: singapore
    plan: starter
    buildCommand: bundle install
    preDeployCommand: bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /health
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SKIP_ASSET_COMPILATION
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DEVISE_JWT_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HONO_API_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Consumed by migration 011 only, and only when the account does not already
      # exist. Unset means the migration generates a random password and logs it once.
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_DEV_PASSWORD
        sync: false
      # Tester requests. See docs/tester-requests.md.
      - key: TESTER_FORM_KEY
        sync: false
      - key: ASC_ISSUER_ID
        sync: false
      - key: ASC_KEY_ID
        sync: false
      - key: ASC_PRIVATE_KEY
        sync: false
      - key: ASC_APP_ID
        sync: false
      - key: ASC_BETA_GROUP_ID
        sync: false
      # Social sign-in. APPLE_PRIVATE_KEY is the .p8 text on one line with "\n" escapes.
      - key: APPLE_BUNDLE_ID
        value: com.banaueinc.gora
      - key: APPLE_TEAM_ID
        value: HXW4W3DD76
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      # Active Record encryption. Changing a key makes stored Apple refresh tokens unreadable.
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        value: ap-southeast-1
      - key: SUPABASE_STORAGE_BUCKET
        value: commute-navigator-maps
